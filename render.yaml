services:
  - type: web
    name: glitchfix
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: glitchfix-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: GLITCHFIX_DATA_DIR
        value: /app/data
      - key: GLITCHFIX_API_TOKEN
        sync: false

name: GlitchFix checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Health smoke test
        run: |
          PORT=3137 node server.js > /tmp/glitchfix.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3137/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/glitchfix.log
          exit 1
